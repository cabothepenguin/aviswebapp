<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
   <f:viewParam name="codigo" value="#{sucursalController.selectedSucursal.codigo}" />
   <f:event type="preRenderView" listener="#{sucursalController.loadSelectedSucursal}" />
   <h:head>
      <title>Avis App - Principal</title>
      <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
      <h:outputStylesheet library="css" name="style.css"/>
       <link rel="stylesheet" type="text/css"
             href="#{request.contextPath}/resources/css/style.css"/>
   </h:head>
   <h:body>
   <div class="container">
     <div> <!--Header app-->
      <div style="width: 100%;display: flex;align-items: flex-start"> <!--Encabezado-->
         <div style="flex: 0 0 60%;">
            <h:graphicImage library="images" name="download.svg" style="width: 100px;display: block"/>
         </div>
         <div style="flex: 0 0 40%;">
            <h1 style="margin-right: 10px">Sistema de gestion Rentario</h1>
         </div>
      </div>
      <div style="flex: 0 0 100%"><!--Menu-->
         <h:form>
             <nav>
                 <ul class="menu">
                     <li class="menu-item">
                         <h:commandButton value="Home" action="irAHome" styleClass="home-btn" />
                     </li>

                     <li class="menu-item has-sub">
                         <span class="menu-link">Usuario</span>
                         <ul class="sub-menu">
                             <li><h:link value="Listar"     outcome="/Usuario/list-usuario.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Agregar"    outcome="/Usuario/add-Usuario.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Actualizar" outcome="/Usuario/update-usuario-byUsername.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Eliminar"   outcome="/Usuario/delete-usuario-byUsername.xhtml?faces-redirect=true"/></li>
                         </ul>
                     </li>

                     <li class="menu-item has-sub">
                         <span class="menu-link">Sucursales</span>
                         <ul class="sub-menu">
                             <li><h:link value="Listar"      outcome="/Sucursales/list-sucursal.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Agregar"     outcome="/Sucursales/add-sucursal.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Actualizar"  outcome="/Sucursales/update-sucursal.xhtml?faces-redirect=true"/></li>
                         </ul>
                     </li>

                     <li class="menu-item has-sub">
                         <span class="menu-link">Vehículos</span>
                         <ul class="sub-menu">
                             <li><h:link value="Listar"      outcome="/Vehiculos/list-vehiculo.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Agregar"     outcome="/Vehiculos/add-vehiculo.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Actualizar"  outcome="/Vehiculos/update-vehiculo.xhtml?faces-redirect=true"/></li>
                         </ul>
                     </li>

                     <li class="menu-item has-sub">
                         <span class="menu-link">Rentas</span>
                         <ul class="sub-menu">
                             <li><h:link value="Listar"      outcome="/Rentas/list-rentas.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Agregar"     outcome="/Rentas/add-rentas.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Actualizar"  outcome="/Rentas/update-rentas.xhtml?faces-redirect=true"/></li>
                         </ul>
                     </li>

                     <li class="menu-item has-sub">
                         <span class="menu-link">Categorías</span>
                         <ul class="sub-menu">
                             <li><h:link value="Listar"      outcome="/Categorias/list-categorias.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Agregar"     outcome="/Categorias/add-categorias.xhtml?faces-redirect=true"/></li>
                             <li><h:link value="Actualizar"  outcome="/Categorias/update-categorias.xhtml?faces-redirect=true"/></li>
                         </ul>
                     </li>

                     <li class="menu-item has-sub">
                         <span class="menu-link">Reportes</span>
                         <ul class="sub-menu">
                             <li><h:link value="Vehículos por categoría" outcome="/Reportes/list-ByCategoria.xhtml?faces-redirect=true"/></li>
                             <!-- agrega más reportes aquí -->

                             <li><h:link value="Vehículos por estado" outcome="/Reportes/list-EstadoCategoria.xhtml?faces-redirect=true"/></li>
                             <!-- agrega más reportes aquí -->
                             <li><h:link value="Vehículos por estado" outcome="/Reportes/list-EstadoRenta.xhtml?faces-redirect=true"/></li>
                             <!-- agrega más reportes aquí -->

                         </ul>
                     </li>

                 </ul>
             </nav>
         </h:form>
      </div><!--Menu end-->
   </div><!--Header app end-->

       <div style="min-height:60vh; max-width:820px; margin:24px auto;">

       <h3 style="text-align:center; margin:8px 0 12px; font-size:1.4rem;">Actualizar Sucursales</h3>

       <!-- Mensajes -->
       <h:messages id="msg" globalOnly="true"
                   style="display:block; margin:10px auto 18px; max-width:700px;
                     padding:10px 12px; border-radius:10px; background:#f8fafc; color:#0f172a;"/>

       <!-- Paso 1: Buscar por código -->
       <h:form rendered="#{sucursalController.selectedSucursal == null}">
           <h:panelGrid columns="2" cellpadding="8"
                        style="margin:0 auto; width:100%; max-width:720px; background:#ffffff;
                        padding:18px 20px; border-radius:14px; box-shadow:0 8px 18px rgba(0,0,0,.06);">

               <h:outputLabel for="codigo" value="Código de sucursal:"
                              style="font-weight:600; font-size:1rem; align-self:center;"/>
               <h:inputText id="codigo" value="#{sucursalController.codigoBusqueda}" required="true"
                            style="padding:10px 12px; border:1px solid #d1d5db; border-radius:10px;
                          font-size:1rem; width:100%; box-sizing:border-box;"/>

               <h:commandButton value="Buscar"
                                action="#{sucursalController.buscarSucursalPorCodigo}"
                                style="padding:10px 14px; background:#2563eb; color:#fff; border:none;
                              border-radius:10px; cursor:pointer; font-weight:700;"/>
               <h:button value="Cancelar" outcome="/Sucursales/list-sucursal.xhtml"
                         style="padding:10px 14px; background:#6b7280; color:#fff; border:none;
                       border-radius:10px; cursor:pointer; font-weight:700;"/>
           </h:panelGrid>
       </h:form>

       <!-- Paso 2: Formulario de actualización -->
       <h:form rendered="#{sucursalController.selectedSucursal != null}">
           <h:panelGrid columns="2" cellpadding="8"
                        style="margin:16px auto 0; width:100%; max-width:720px; background:#ffffff;
                        padding:18px 20px; border-radius:14px; box-shadow:0 8px 18px rgba(0,0,0,.06);">

               <h:outputLabel for="nombre" value="Nombre:"
                              style="font-weight:600; align-self:center;"/>
               <h:inputText id="nombre" value="#{sucursalController.selectedSucursal.nombre}" required="true"
                            style="padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; width:100%;"/>

               <h:outputLabel for="encargado" value="Encargado:"
                              style="font-weight:600; align-self:center;"/>
               <h:inputText id="encargado" value="#{sucursalController.selectedSucursal.encargado}" required="true"
                            style="padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; width:100%;"/>

               <h:outputLabel for="direccion" value="Dirección:"
                              style="font-weight:600; align-self:center;"/>
               <h:inputText id="direccion" value="#{sucursalController.selectedSucursal.direccion}" required="true"
                            style="padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; width:100%;"/>

               <h:outputLabel for="telefono" value="Teléfono:"
                              style="font-weight:600; align-self:center;"/>
               <h:inputText id="telefono" value="#{sucursalController.selectedSucursal.telefono}" required="true"
                            style="padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; width:100%;"/>

               <h:outputLabel for="correo" value="Correo:"
                              style="font-weight:600; align-self:center;"/>
               <h:inputText id="correo" value="#{sucursalController.selectedSucursal.correo}" required="true"
                            style="padding:10px 12px; border:1px solid #d1d5db; border-radius:10px; width:100%;"/>

           </h:panelGrid>

           <div style="max-width:720px; margin:12px auto 0; text-align:right;">
               <h:commandButton value="Guardar cambios" action="#{sucursalController.update}"
                                style="padding:10px 16px; background:#2563eb; color:#fff; border:0;
                              border-radius:10px; font-weight:700; margin-right:8px;"/>
               <h:commandButton value="Cancelar" action="#{sucursalController.cancelarEdicion}"
                                style="padding:10px 16px; background:#6b7280; color:#fff; border:0;
                              border-radius:10px; font-weight:700;"/>
           </div>
       </h:form>

   </div>
       Content app end-->

      <!-- Footer -->
      <div>
         <hr/>
         <p>Avis Costa Rica. Todos los derechos reservado&copy; 2025</p>
      </div>
   </div>
   </h:body>
</f:view>
</html>
