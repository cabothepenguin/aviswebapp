<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
   <h:head>
      <title>Avis App - Agregar Vehículo</title>
      <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
      <h:outputStylesheet library="css" name="style.css"/>
      <link rel="stylesheet" type="text/css"
            href="#{request.contextPath}/resources/css/style.css"/>
   </h:head>

   <h:body>
      <div class="container">
         <!-- Header -->
         <div class="navbar">
            <div class="nav-inner">

               <!-- Marca -->
               <div class="brand">
                  <h2 class="brand-text">AVIS</h2>
               </div>

               <!-- Menú -->
               <nav>
                  <ul class="menu">
                     <li class="menu-item">
                        <h:commandButton value="Home" action="irAHome" styleClass="home-btn" />
                     </li>

                     <li class="menu-item has-sub">
                        <span class="menu-link">Usuario</span>
                        <ul class="sub-menu">
                           <li><h:link value="Listar"     outcome="/Usuario/list-usuario.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Agregar"    outcome="/Usuario/add-Usuario.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Actualizar" outcome="/Usuario/update-usuario-byUsername.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Eliminar"   outcome="/Usuario/delete-usuario-byUsername.xhtml?faces-redirect=true"/></li>
                        </ul>
                     </li>

                     <li class="menu-item has-sub">
                        <span class="menu-link">Sucursales</span>
                        <ul class="sub-menu">
                           <li><h:link value="Listar"      outcome="/Sucursales/list-sucursal.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Agregar"     outcome="/Sucursales/add-sucursal.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Actualizar"  outcome="/Sucursales/update-sucursal.xhtml?faces-redirect=true"/></li>
                        </ul>
                     </li>

                     <li class="menu-item has-sub">
                        <span class="menu-link">Vehículos</span>
                        <ul class="sub-menu">
                           <li><h:link value="Listar"      outcome="/Vehiculos/list-vehiculo.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Agregar"     outcome="/Vehiculos/add-vehiculo.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Actualizar"  outcome="/Vehiculos/update-vehiculo.xhtml?faces-redirect=true"/></li>
                        </ul>
                     </li>

                     <li class="menu-item has-sub">
                        <span class="menu-link">Rentas</span>
                        <ul class="sub-menu">
                           <li><h:link value="Listar"      outcome="/Rentas/list-rentas.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Agregar"     outcome="/Rentas/add-rentas.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Actualizar"  outcome="/Rentas/update-rentas.xhtml?faces-redirect=true"/></li>
                        </ul>
                     </li>

                     <li class="menu-item has-sub">
                        <span class="menu-link">Categorías</span>
                        <ul class="sub-menu">
                           <li><h:link value="Listar"      outcome="/Categorias/list-categorias.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Agregar"     outcome="/Categorias/add-categorias.xhtml?faces-redirect=true"/></li>
                           <li><h:link value="Actualizar"  outcome="/Categorias/update-categorias.xhtml?faces-redirect=true"/></li>
                        </ul>
                     </li>

                     <li class="menu-item has-sub">
                        <span class="menu-link">Reportes</span>
                        <ul class="sub-menu">
                           <li><h:link value="Vehículos por categoría" outcome="/Reportes/list-ByCategoria.xhtml?faces-redirect=true"/></li>
                           <!-- agrega más reportes aquí -->

                           <li><h:link value="Vehículos por estado" outcome="/Reportes/list-EstadoCategoria.xhtml?faces-redirect=true"/></li>
                           <!-- agrega más reportes aquí -->
                           <li><h:link value="Vehículos por estado" outcome="/Reportes/list-EstadoRenta.xhtml?faces-redirect=true"/></li>
                           <!-- agrega más reportes aquí -->

                        </ul>
                     </li>

                  </ul>
               </nav>

            </div>
         </div>
         <!-- /Header -->

         <!-- Content -->
         <div style="min-height:60vh">
            <h3>Agregar Vehículo</h3>

            <!-- Mensajes -->
            <h:messages id="msg"
                        globalOnly="false"
                        styleClass="message-global"
                        infoClass="message-info"
                        errorClass="message-error"
                        warnClass="message-warn"/>

            <!-- Formulario -->
            <h:form id="vehiculoForm" enctype="multipart/form-data" styleClass="form-container">

               <!-- Placa -->
               <div class="form-group">
                  <h:outputLabel for="placa" value="Placa:" styleClass="form-label"/>
                  <h:inputText id="placa" styleClass="form-control"
                               value="#{vehiculoBean.newVehiculo.placa}"
                               required="true" requiredMessage="La placa es obligatoria"/>
                  <h:message for="placa" styleClass="error-message"/>
               </div>

               <!-- Modelo -->
               <div class="form-group">
                  <h:outputLabel for="modelo" value="Modelo:" styleClass="form-label"/>
                  <h:inputText id="modelo" styleClass="form-control"
                               value="#{vehiculoBean.newVehiculo.modelo}"
                               required="true" requiredMessage="El modelo es obligatorio"/>
                  <h:message for="modelo" styleClass="error-message"/>
               </div>

               <!-- Marca -->
               <div class="form-group">
                  <h:outputLabel for="marca" value="Marca:" styleClass="form-label"/>
                  <h:inputText id="marca" styleClass="form-control"
                               value="#{vehiculoBean.newVehiculo.marca}"
                               required="true" requiredMessage="La marca es obligatoria"/>
                  <h:message for="marca" styleClass="error-message"/>
               </div>

               <!-- Categoría -->
               <div class="form-group">
                  <h:outputLabel for="categoria" value="Categoría:" styleClass="form-label"/>
                  <h:selectOneMenu id="categoria" styleClass="form-control"
                                   value="#{vehiculoBean.newVehiculo.categoria}"
                                   converter="categoriaVehiculoConverter"
                                   required="true" requiredMessage="La categoría es obligatoria">
                     <f:selectItems value="#{vehiculoBean.categorias}" var="cat"
                                    itemLabel="#{cat.descripcion}"
                                    itemValue="#{cat}" />
                  </h:selectOneMenu>



                  <h:message for="categoria" styleClass="error-message"/>
               </div>

               <!-- Estado -->
               <div class="form-group">
                  <h:outputLabel for="estado" value="Estado:" styleClass="form-label"/>
                  <h:selectOneMenu id="estado" styleClass="form-control"
                                   value="#{vehiculoBean.newVehiculo.estado}"
                                   required="true" requiredMessage="El estado es obligatorio">
                     <f:selectItem itemValue="disponible" itemLabel="Disponible"/>
                     <f:selectItem itemValue="rentado" itemLabel="Rentado"/>
                     <f:selectItem itemValue="mantenimiento" itemLabel="Mantenimiento"/>
                  </h:selectOneMenu>
                  <h:message for="estado" styleClass="error-message"/>
               </div>

               <!-- Año -->
               <div class="form-group">
                  <h:outputLabel for="anio" value="Año:" styleClass="form-label"/>
                  <h:inputText id="anio" styleClass="form-control"
                               value="#{vehiculoBean.newVehiculo.anio}"
                               required="true" requiredMessage="El año es obligatorio">
                     <f:validateLongRange minimum="1900" maximum="2030"/>
                  </h:inputText>
                  <h:message for="anio" styleClass="error-message"/>
               </div>

               <!-- Precio -->
               <div class="form-group">
                  <h:outputLabel for="precio" value="Precio:" styleClass="form-label"/>
                  <h:inputText id="precio" styleClass="form-control"
                               value="#{vehiculoBean.newVehiculo.precio}"
                               required="true" requiredMessage="El precio es obligatorio">
                     <f:validateLongRange minimum="0"/>
                  </h:inputText>
                  <h:message for="precio" styleClass="error-message"/>
               </div>

               <!-- Imagen -->
               <div class="form-group">
                  <h:outputLabel for="foto" value="Fotografía:" styleClass="form-label"/>
                  <h:inputFile id="foto" value="#{vehiculoBean.uploadedFile}" styleClass="form-control-file"/>
                  <h:outputText id="fileNameDisplay"
                                value="Archivo seleccionado: #{vehiculoBean.fileName}"
                                styleClass="file-name-display"
                                rendered="#{not empty vehiculoBean.fileName}"/>
               </div>

               <!-- Botones -->
               <div class="form-actions">
                  <h:commandButton styleClass="btn btn-primary"
                                   value="Guardar"
                                   action="#{vehiculoBean.addVehiculo}"/>
                  <h:commandButton styleClass="btn btn-secondary"
                                   type="reset" value="Limpiar"/>
               </div>
            </h:form>
         </div>
         <!-- /Content -->

         <!-- Footer -->
         <div>
            <hr/>
            <p>Avis Costa Rica. Todos los derechos reservados &copy; 2025</p>
         </div>
      </div>
   </h:body>
</f:view>
</html>
