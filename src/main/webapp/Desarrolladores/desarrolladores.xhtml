<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Acerca de los Desarrolladores</title>

    <style>
        /* ================================
           Estilos exclusivos de esta página
           Prefijo: dev-
           Color principal: #C8102E
           ================================ */

        .dev-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            background: linear-gradient(135deg, #fff5f5, #ffe5e5);
            font-family: "Segoe UI", Roboto, sans-serif;
        }

        .dev-card {
            background: #ffffff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            padding: 40px 60px;
            max-width: 650px;
            width: 90%;
            border-top: 8px solid #C8102E;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .dev-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 28px rgba(200, 16, 46, 0.3);
        }

        .dev-title {
            font-size: 2.2rem;
            color: #C8102E;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .dev-subtitle {
            font-size: 1.4rem;
            color: #2c2c2c;
            margin-top: 28px;
            font-weight: 600;
        }

        .dev-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 30px 0;
        }

        .dev-item {
            font-size: 1.2rem;
            font-weight: 500;
            color: #444444;
            margin: 6px 0;
            transition: color 0.2s ease;
        }

        .dev-item:hover {
            color: #C8102E;
        }

        .dev-info {
            font-size: 1rem;
            color: #555555;
            line-height: 1.6;
            margin-top: 10px;
        }

        .dev-footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #777777;
        }

        @media (max-width: 600px) {
            .dev-card {
                padding: 30px 25px;
            }
            .dev-title {
                font-size: 1.8rem;
            }
            .dev-subtitle {
                font-size: 1.2rem;
            }
            .dev-item {
                font-size: 1rem;
            }
        }
    </style>
</h:head>

<h:body>
    <div class="dev-container">
        <div class="dev-card">
            <h1 class="dev-title">Equipo de Desarrollo</h1>

            <ul class="dev-list">
                <li class="dev-item">Josue Gomes Rodríguez</li>
                <li class="dev-item">Melany Rosales</li>
                <li class="dev-item">Yazir Zuñiga</li>
            </ul>

            <h2 class="dev-subtitle">Detalles del Sistema</h2>

            <div class="dev-info">
                <p><strong>Versión:</strong> JDK 22</p>
                <p><strong>Nombre del sistema:</strong> Sistema de Gestión de Vehículos</p>
            </div>

            <div class="dev-footer">
                © 2025 Proyecto Académico — Universidad Nacional de Costa Rica
            </div>
        </div>
    </div>
</h:body>
</html>
