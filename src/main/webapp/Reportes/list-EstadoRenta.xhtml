<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Rentas por estado</title>
</h:head>
<h:body>

    <h:form id="fEstado" style="display:flex; flex-direction:column; gap:16px; align-items:center;">

        <!-- Mensajes -->
        <h:messages id="msg" globalOnly="true"
                    style="max-width:900px; font-weight:600; font-size:16px;"/>

        <!-- Fila de controles -->
        <div style="display:flex; gap:12px; align-items:center; width:900px; max-width:95%;">
            <label for="comboEstado" style="min-width:110px; font-weight:700;">Estado:</label>

            <h:selectOneMenu id="comboEstado"
                             value="#{rentasBean.estadoFiltro}"
                             style="flex:1; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:1rem;">
                <f:selectItem itemValue=""              itemLabel="-- Todos --"/>
                <f:selectItem itemValue="activa"        itemLabel="Activas"/>
                <f:selectItem itemValue="finalizada"    itemLabel="Finalizadas"/>
                <f:selectItem itemValue="cancelada"     itemLabel="Canceladas"/>

                <!-- Filtra automáticamente al cambiar -->
                <f:ajax execute="@this"
                        listener="#{rentasBean.filtrarPorEstado}"
                        render="fEstado:msg fEstado:tabla"/>
            </h:selectOneMenu>

            <!-- Botón opcional: volver a “Todos” -->
            <h:commandButton value="Mostrar todos"
                             style="padding:10px 16px; background:#6b7280; color:#fff; border:0; border-radius:10px; font-weight:700; cursor:pointer;">
                <f:setPropertyActionListener target="#{rentasBean.estadoFiltro}" value=""/>
                <f:ajax execute="@this"
                        listener="#{rentasBean.filtrarPorEstado}"
                        render="fEstado:msg fEstado:comboEstado fEstado:tabla"/>
            </h:commandButton>
        </div>

        <!-- Tabla de resultados -->
        <h:panelGroup id="tabla" layout="block" style="width:900px; max-width:95%;">

            <!-- Cuando hay resultados -->
            <h:panelGroup rendered="#{not empty rentasBean.rentasFiltradas}">
                <h:dataTable value="#{rentasBean.rentasFiltradas}" var="r"
                             style="width:100%; border-collapse:collapse; margin-top:10px;"
                             rowClasses="rowA,rowB" headerClass="th" columnClasses="td,td,td,td,td,td,td">

                    <h:column>
                        <f:facet name="header"># Renta</f:facet>
                        <h:outputText value="#{r.numeroRenta}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Cliente</f:facet>
                        <h:outputText value="#{r.clienteNombre}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Vehículo</f:facet>
                        <h:outputText value="#{r.vehiculo.placa}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Sucursal</f:facet>
                        <h:outputText value="#{r.sucursal.codigo}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Inicio</f:facet>
                        <h:outputText value="#{r.fechaInicio}">
                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                        </h:outputText>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Fin</f:facet>
                        <h:outputText value="#{r.fechaFin}">
                            <f:convertDateTime pattern="yyyy-MM-dd"/>
                        </h:outputText>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Precio</f:facet>
                        <h:outputText value="#{r.precioTotal}">
                            <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                        </h:outputText>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Estado</f:facet>
                        <h:outputText value="#{r.estado}"/>
                    </h:column>

                </h:dataTable>
            </h:panelGroup>

            <!-- Cuando no hay resultados -->
            <h:panelGroup rendered="#{empty rentasBean.rentasFiltradas}">
                <div style="margin-top:14px; color:#6b7280; font-weight:600;">
                    No hay rentas para mostrar.
                </div>
            </h:panelGroup>
        </h:panelGroup>

        <!-- Estilos mínimos para la tabla -->
        <style>
            .th { background:#f3f4f6; font-weight:700; padding:10px; border-bottom:1px solid #e5e7eb; text-align:left; }
            .td { padding:10px; border-bottom:1px solid #f1f5f9; }
            .rowA { background:#ffffff; }
            .rowB { background:#fcfcfd; }
        </style>

    </h:form>

</h:body>
</html>
