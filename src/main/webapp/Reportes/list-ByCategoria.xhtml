<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Vehículos por categoría</title>
</h:head>
<h:body>

    <h:form id="fCat" style="display:flex; flex-direction:column; gap:16px; align-items:center;">

        <!-- Mensajes -->
        <h:messages id="msg" globalOnly="true"
                    style="max-width:900px; font-weight:600; font-size:16px;"/>

        <!-- Fila de controles -->
        <div style="display:flex; gap:12px; align-items:center; width:900px; max-width:95%;">
            <label style="min-width:110px; font-weight:700;">Categoría:</label>

            <h:selectOneMenu id="comboCat"
                             value="#{categoriaController.codigoCategoriaSeleccionada}"
                             style="flex:1; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:1rem;">
                <f:selectItem itemLabel="-- Seleccione --" itemValue="#{null}"/>
                <f:selectItems value="#{categoriaController.listaCategorias}"
                               var="c"
                               itemValue="#{c.codigo}"
                               itemLabel="#{c.descripcion}"/>
            </h:selectOneMenu>

            <h:commandButton value="Ver vehículos"
                             action="#{categoriaController.buscarVehiculosPorCategoria}"
                             style="padding:10px 16px; background:#2563eb; color:#fff; border:0; border-radius:10px; font-weight:700; cursor:pointer;">
                <f:ajax execute="@form" render="fCat:msg fCat:tabla"/>
            </h:commandButton>

            <h:commandButton value="Limpiar"
                             action="#{categoriaController.limpiarVehiculosPorCategoria}"
                             style="padding:10px 16px; background:#6b7280; color:#fff; border:0; border-radius:10px; font-weight:700; cursor:pointer;">
                <f:ajax execute="@this" render="fCat:msg fCat:comboCat fCat:tabla"/>
            </h:commandButton>
        </div>

        <!-- Tabla de resultados -->
        <h:panelGroup id="tabla" layout="block" style="width:900px; max-width:95%;">
            <h:panelGroup rendered="#{not empty categoriaController.vehiculosPorCategoria}">
                <h:dataTable value="#{categoriaController.vehiculosPorCategoria}" var="v"
                             style="width:100%; border-collapse:collapse; margin-top:10px;"
                             rowClasses="rowA,rowB" headerClass="th" columnClasses="td,td,td,td,td,td,td">

                    <h:column>
                        <f:facet name="header">Placa</f:facet>
                        <h:outputText value="#{v.placa}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Marca</f:facet>
                        <h:outputText value="#{v.marca}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Modelo</f:facet>
                        <h:outputText value="#{v.modelo}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Año</f:facet>
                        <h:outputText value="#{v.anio}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Precio</f:facet>
                        <h:outputText value="#{v.precio}">
                            <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="2"/>
                        </h:outputText>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Estado</f:facet>
                        <h:outputText value="#{v.estado}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">Categoría</f:facet>
                        <h:outputText value="#{v.categoria.descripcion}"/>
                    </h:column>

                </h:dataTable>
            </h:panelGroup>

            <h:panelGroup rendered="#{empty categoriaController.vehiculosPorCategoria}">
                <div style="margin-top:14px; color:#6b7280; font-weight:600;">
                    No hay vehículos para mostrar.
                </div>
            </h:panelGroup>
        </h:panelGroup>

        <!-- Estilos mínimos para la tabla -->
        <style>
            .th { background:#f3f4f6; font-weight:700; padding:10px; border-bottom:1px solid #e5e7eb; text-align:left; }
            .td { padding:10px; border-bottom:1px solid #f1f5f9; }
            .rowA { background:#ffffff; }
            .rowB { background:#fcfcfd; }
        </style>
    </h:form>



</h:body>
</html>
