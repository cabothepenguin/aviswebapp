<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Avis App - Principal</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
    <link rel="stylesheet" type="text/css"
          href="#{request.contextPath}/resources/css/style.css"/>
</h:head>

<h:body>

    <div class="container">
        <!-- Header app -->
        <div style="flex: 0 0 100%">
            <!-- Menu -->
            <h:form>
                <nav>
                    <ul class="menu-bar">



                        <li class="menu-item">
                            <span>Usuario</span>
                            <ul class="sub-menu">
                                <li class="sub-menu-item">
                                    <h:link value="Listar" outcome="/Usuario/list-usuario.xhtml?faces-redirect=true"/>
                                </li>
                                <li class="sub-menu-item">
                                    <h:link value="Agregar" outcome="/Usuario/add-Usuario.xhtml?faces-redirect=true"/>
                                </li>
                                <li class="sub-menu-item">
                                    <h:link value="actualizar" outcome="/Usuario/update-usuario-byUsername.xhtml?faces-redirect=true"/>
                                </li>
                                <li class="sub-menu-item">
                                    <h:link value="eliminar" outcome="/Usuario/add-Usuario-byUsername.xhtml?faces-redirect=true"/>
                                </li>
                            </ul>
                        </li>

                        <li class="menu-item">
                            <span>Sucursales</span>
                            <ul class="sub-menu">
                                <li class="sub-menu-item">
                                    <h:link value="Listar" outcome="/professor/list-professor.xhtml?faces-redirect=true"/>
                                </li>
                                <li class="sub-menu-item">
                                    <h:link value="Agregar" outcome="/professor/add-professor.xhtml?faces-redirect=true"/>
                                </li>
                            </ul>
                        </li>

                        <li class="menu-item">
                            <span>Categorias</span>
                            <ul class="sub-menu">
                                <li class="sub-menu-item">
                                    <h:link value="Listar" outcome="/courses/list-course.xhtml?faces-redirect=true"/>
                                </li>
                                <li class="sub-menu-item">
                                    <h:link value="Agregar" outcome="/courses/add-course.xhtml?faces-redirect=true"/>
                                </li>
                            </ul>
                        </li>

                        <li class="menu-item">
                            <span>Matricula</span>
                            <ul class="sub-menu">
                                <li class="sub-menu-item">
                                    <h:link value="Listar" outcome="/student/list-students.xhtml?faces-redirect=true"/>
                                </li>
                                <li class="sub-menu-item">
                                    <h:link value="Agregar" outcome="/student/add-student.xhtml?faces-redirect=true"/>
                                </li>
                            </ul>
                        </li>

                    </ul>
                </nav>
            </h:form>
        </div>
        <!-- Menu end -->
    </div>
    <!-- Header app end -->


    <!-- /////////////////////////////////////////////////////////// -->

    <h:form id="formBuscar">

        <!-- Mensajes para este form (coincide con render="@form msg") -->
        <h:messages id="msg" globalOnly="true" />

        <!-- === Buscador compacto y centrado === -->
        <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin:24px 0;">
            <h:outputLabel for="user" value="Username:"
                           style="font-weight:600; font-size:1rem;"/>
            <h:inputText id="user"
                         value="#{usuarioController.usernameQuery}"
                         required="true"
                         requiredMessage="Ingrese un username"
                         style="padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:1rem; width:260px; box-sizing:border-box;"/>
            <h:commandButton value="Buscar"
                             action="#{usuarioController.buscarPorUsername}"
                             style="padding:10px 14px; background:#2563eb; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600;">
                <f:ajax execute="@form" render="@form detalles msg"/>
            </h:commandButton>
            <h:commandButton value="Limpiar"
                             action="#{usuarioController.limpiarBusqueda}"
                             style="padding:10px 14px; background:#6b7280; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600;">
                <f:ajax render="@form detalles msg"/>
            </h:commandButton>
        </div>

        <!-- Sección de edición: solo aparece si hay resultado -->
        <h:panelGroup id="detalles" layout="block"
                      rendered="#{not empty usuarioController.usuarioEdit}">

            <h:panelGroup layout="block"
                          style="margin:20px auto; max-width:450px; background:#fff;
                             padding:20px 24px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.08);">

                <h2 style="margin:0 0 16px; font-family:system-ui; font-size:1.3rem; color:#0d1b2a; text-align:center;">
                    Editar datos del usuario
                </h2>

                <!-- Campos -->
                <div style="display:flex; flex-direction:column; gap:12px;">

                    <!-- Username -->
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px;">Username</label>
                        <h:inputText value="#{usuarioController.usuarioEdit.username}" disabled="true"
                                     style="width:100%; box-sizing:border-box; padding:10px; border:1px solid #ccc;
                                        border-radius:8px; font-size:0.95rem; background:#f3f4f6; color:#6b7280;"/>
                    </div>

                    <!-- Nombre -->
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px;">Nombre</label>
                        <h:inputText value="#{usuarioController.usuarioEdit.nombre}" required="true"
                                     requiredMessage="El nombre es obligatorio"
                                     style="width:100%; box-sizing:border-box; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:0.95rem;"/>
                    </div>

                    <!-- Apellido -->
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px;">Apellido</label>
                        <h:inputText value="#{usuarioController.usuarioEdit.apellido}" required="true"
                                     requiredMessage="El apellido es obligatorio"
                                     style="width:100%; box-sizing:border-box; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:0.95rem;"/>
                    </div>

                    <!-- Correo -->
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px;">Correo</label>
                        <h:inputText value="#{usuarioController.usuarioEdit.correo}" required="true"
                                     requiredMessage="El correo es obligatorio"
                                     style="width:100%; box-sizing:border-box; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:0.95rem;"/>
                    </div>

                    <!-- Password -->
                    <div>
                        <label style="display:block; font-weight:600; margin-bottom:4px;">Password (opcional)</label>
                        <h:inputSecret value="#{usuarioController.usuarioEdit.password}"
                                       style="width:100%; box-sizing:border-box; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:0.95rem;"/>
                    </div>
                </div>

                <!-- Botón -->
                <div style="margin-top:18px; text-align:right;">
                    <h:commandButton value="Guardar cambios"
                                     action="#{usuarioController.guardarCambios}"
                                     style="background:#2563eb; color:#fff; border:0; padding:10px 18px;
                        border-radius:8px; font-weight:600; font-size:0.95rem; cursor:pointer;">
                        <f:ajax execute="@form" render="@form msg"/>
                    </h:commandButton>



                </div>
                <div style="margin-top:18px;">
                    <h:messages id="msg1" globalOnly="true"
                                style="margin:15px auto; max-width:500px; font-weight:bold; font-size:16px; color:#333;"
                                redisplay="true"/>
                </div>

            </h:panelGroup>
        </h:panelGroup>

    </h:form>


</h:body>
</html>
