<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<f:view>
   <h:head>
      <title>Avis App - Agregar Renta</title>
      <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
      <h:outputStylesheet library="css" name="style.css"/>
   </h:head>

   <h:body>
      <div class="container">

         <!-- Header -->
         <div style="width:100%;display:flex;align-items:flex-start">
            <div style="flex:0 0 60%;">
               <h:graphicImage library="images" name="download.svg" style="width:100px;display:block"/>
            </div>
            <div style="flex:0 0 40%;">
               <h1 style="margin-right:10px">Sistema de gestión Rentario</h1>
            </div>
         </div>

         <!-- Menu -->
         <h:form>
            <nav>
               <ul class="menu-bar">
                  <li class="menu-item">
                     <h:commandButton styleClass="btn btn-primary" value="Home" action="irAHome" />
                  </li>
                  <li class="menu-item">
                     <span>Usuario</span>
                     <ul class="sub-menu">
                        <li class="sub-menu-item">
                           <h:link value="Listar" outcome="/Usuario/list-usuario.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Agregar" outcome="/Usuario/add-usuario.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Actualizar" outcome="/Usuario/update-usuario.xhtml?faces-redirect=true"/>
                        </li>
                     </ul>
                  </li>
                  <li class="menu-item">
                     <span>Sucursales</span>
                     <ul class="sub-menu">
                        <li class="sub-menu-item">
                           <h:link value="Listar" outcome="/Sucursales/list-sucursal.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Agregar" outcome="/Sucursales/add-sucursal.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Actualizar" outcome="/Sucursales/update-sucursal.xhtml?faces-redirect=true"/>
                        </li>
                     </ul>
                  </li>
                  <li class="menu-item">
                     <span>Vehiculos</span>
                     <ul class="sub-menu">
                        <li class="sub-menu-item">
                           <h:link value="Listar" outcome="/Vehiculos/list-vehiculo.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Agregar" outcome="/Vehiculos/add-vehiculo.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Actualizar" outcome="/Vehiculos/update-vehiculo.xhtml?faces-redirect=true"/>
                        </li>
                     </ul>
                  </li>
                  <li class="menu-item">
                     <span>Rentas</span>
                     <ul class="sub-menu">
                        <li class="sub-menu-item">
                           <h:link value="Listar" outcome="/Rentas/list-rentas.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Agregar" outcome="/Rentas/add-rentas.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Actualizar" outcome="/Rentas/update-rentas.xhtml?faces-redirect=true"/>
                        </li>
                     </ul>
                  </li>
                  <li class="menu-item">
                     <span>Categorias</span>
                     <ul class="sub-menu">
                        <li class="sub-menu-item">
                           <h:link value="Listar" outcome="/Categorias/list-categorias.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Agregar" outcome="/Categorias/add-categorias.xhtml?faces-redirect=true"/>
                        </li>
                        <li class="sub-menu-item">
                           <h:link value="Actualizar" outcome="/Categorias/update-categorias.xhtml?faces-redirect=true"/>
                        </li>
                     </ul>
                  </li>
               </ul>
            </nav>
         </h:form>

         <!-- Content -->
         <div style="min-height:60vh">
            <h3>Agregar Renta</h3>

            <h:messages id="msg" globalOnly="false"
                        styleClass="message-global"
                        infoClass="message-info"
                        errorClass="message-error"
                        warnClass="message-warn"/>

            <h:form id="rentaForm">



               <!-- Cliente -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="cliente" value="Cliente:"/>
                  <h:inputText id="cliente"
                               value="#{rentasBean.newRenta.clienteNombre}"
                               required="true" requiredMessage="El cliente es obligatorio"/>
               </h:panelGrid>

               <!-- Vehículo por placa -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="vehiculo" value="Vehículo:"/>
                  <h:selectOneMenu id="vehiculo"
                                   value="#{rentasBean.newRenta.vehiculoPlaca}"
                                   required="true" requiredMessage="El vehículo es obligatorio">
                     <f:selectItem itemLabel="-- Seleccione un vehículo --" itemValue="#{null}"/>
                     <f:selectItems value="#{rentasBean.vehiculos}" var="v"
                                    itemLabel="#{v.marca} #{v.modelo} (#{v.placa})"
                                    itemValue="#{v.placa}"/>
                  </h:selectOneMenu>
               </h:panelGrid>

               <!-- Sucursal por código -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="sucursal" value="Sucursal:"/>
                  <h:selectOneMenu id="sucursal"
                                   value="#{rentasBean.newRenta.sucursalCodigo}"
                                   required="true" requiredMessage="La sucursal es obligatoria">
                     <f:selectItem itemLabel="-- Seleccione una sucursal --" itemValue="#{null}"/>
                     <f:selectItems value="#{rentasBean.sucursales}" var="s"
                                    itemLabel="#{s.nombre} - #{s.ciudad}"
                                    itemValue="#{s.codigo}"/>
                  </h:selectOneMenu>
               </h:panelGrid>

               <!-- Fechas -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="inicio" value="Fecha inicio (yyyy-MM-dd):"/>
                  <h:inputText id="inicio"
                               value="#{rentasBean.newRenta.fechaInicio}"
                               required="true">
                     <f:convertDateTime pattern="yyyy-MM-dd"/>
                  </h:inputText>

                  <h:outputLabel for="fin" value="Fecha fin (yyyy-MM-dd):"/>
                  <h:inputText id="fin"
                               value="#{rentasBean.newRenta.fechaFin}"
                               required="true">
                     <f:convertDateTime pattern="yyyy-MM-dd"/>
                  </h:inputText>
               </h:panelGrid>

               <!-- Precio -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="precio" value="Precio total:"/>
                  <h:inputText id="precio"
                               value="#{rentasBean.newRenta.precioTotal}"
                               required="true">
                     <f:validateLongRange minimum="0"/>
                  </h:inputText>
               </h:panelGrid>

               <!-- Estado -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="estado" value="Estado:"/>
                  <h:selectOneMenu id="estado"
                                   value="#{rentasBean.newRenta.estado}"
                                   required="true">
                     <f:selectItem itemLabel="Activa" itemValue="activa"/>
                     <f:selectItem itemLabel="Finalizada" itemValue="finalizada"/>
                     <f:selectItem itemLabel="Cancelada" itemValue="cancelada"/>
                  </h:selectOneMenu>
               </h:panelGrid>

               <h:commandButton value="Guardar" action="#{rentasBean.add}"/>
               <h:commandButton type="reset" value="Limpiar"/>

            </h:form>
         </div>

         <!-- Footer -->
         <div>
            <hr/>
            <p>Avis Costa Rica. Todos los derechos reservados &copy; 2025</p>
         </div>
      </div>
   </h:body>
</f:view>
</html>
