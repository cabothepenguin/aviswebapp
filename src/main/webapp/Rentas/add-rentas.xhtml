<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<f:view>
   <h:head>
      <title>Avis App - Agregar Renta</title>
      <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
      <h:outputStylesheet library="css" name="style.css"/>
      <link rel="stylesheet" type="text/css"
            href="#{request.contextPath}/resources/css/style.css"/>
   </h:head>

   <h:body>
      <div class="container">

         <!-- Header -->
         <div style="width:100%;display:flex;align-items:flex-start">
            <div style="flex:0 0 60%;">
               <h:graphicImage library="images" name="download.svg" style="width:100px;display:block"/>
            </div>
            <div style="flex:0 0 40%;">
               <h1 style="margin-right:10px">Sistema de gestión Rentario</h1>
            </div>
         </div>

         <!-- Menu -->
         <h:form>
            <nav>
               <ul class="menu">
                  <li class="menu-item">
                     <h:commandButton value="Home" action="irAHome" styleClass="home-btn" />
                  </li>

                  <li class="menu-item has-sub">
                     <span class="menu-link">Usuario</span>
                     <ul class="sub-menu">
                        <li><h:link value="Listar"     outcome="/Usuario/list-usuario.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Agregar"    outcome="/Usuario/add-Usuario.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Actualizar" outcome="/Usuario/update-usuario-byUsername.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Eliminar"   outcome="/Usuario/delete-usuario-byUsername.xhtml?faces-redirect=true"/></li>
                     </ul>
                  </li>

                  <li class="menu-item has-sub">
                     <span class="menu-link">Sucursales</span>
                     <ul class="sub-menu">
                        <li><h:link value="Listar"      outcome="/Sucursales/list-sucursal.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Agregar"     outcome="/Sucursales/add-sucursal.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Actualizar"  outcome="/Sucursales/update-sucursal.xhtml?faces-redirect=true"/></li>
                     </ul>
                  </li>

                  <li class="menu-item has-sub">
                     <span class="menu-link">Vehículos</span>
                     <ul class="sub-menu">
                        <li><h:link value="Listar"      outcome="/Vehiculos/list-vehiculo.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Agregar"     outcome="/Vehiculos/add-vehiculo.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Actualizar"  outcome="/Vehiculos/update-vehiculo.xhtml?faces-redirect=true"/></li>
                     </ul>
                  </li>

                  <li class="menu-item has-sub">
                     <span class="menu-link">Rentas</span>
                     <ul class="sub-menu">
                        <li><h:link value="Listar"      outcome="/Rentas/list-rentas.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Agregar"     outcome="/Rentas/add-rentas.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Actualizar"  outcome="/Rentas/update-rentas.xhtml?faces-redirect=true"/></li>
                     </ul>
                  </li>

                  <li class="menu-item has-sub">
                     <span class="menu-link">Categorías</span>
                     <ul class="sub-menu">
                        <li><h:link value="Listar"      outcome="/Categorias/list-categorias.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Agregar"     outcome="/Categorias/add-categorias.xhtml?faces-redirect=true"/></li>
                        <li><h:link value="Actualizar"  outcome="/Categorias/update-categorias.xhtml?faces-redirect=true"/></li>
                     </ul>
                  </li>

                  <li class="menu-item has-sub">
                     <span class="menu-link">Reportes</span>
                     <ul class="sub-menu">
                        <li><h:link value="Vehículos por categoría" outcome="/Reportes/list-ByCategoria.xhtml?faces-redirect=true"/></li>
                        <!-- agrega más reportes aquí -->

                        <li><h:link value="Vehículos por estado" outcome="/Reportes/list-EstadoCategoria.xhtml?faces-redirect=true"/></li>
                        <!-- agrega más reportes aquí -->
                        <li><h:link value="Vehículos por estado" outcome="/Reportes/list-EstadoRenta.xhtml?faces-redirect=true"/></li>
                        <!-- agrega más reportes aquí -->

                     </ul>
                  </li>

               </ul>
            </nav>
         </h:form>

         <!-- Content -->
         <div style="min-height:60vh">
            <h3>Agregar Renta</h3>

            <h:messages id="msg" globalOnly="false"
                        styleClass="message-global"
                        infoClass="message-info"
                        errorClass="message-error"
                        warnClass="message-warn"/>

            <h:form id="rentaForm">



               <!-- Cliente -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="cliente" value="Cliente:"/>
                  <h:inputText styleClass="form-control" id="cliente"
                               value="#{rentasBean.newRenta.clienteNombre}"
                               required="true" requiredMessage="El cliente es obligatorio"/>
               </h:panelGrid>

               <!-- Vehículo por placa -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="vehiculo" value="Vehículo:"/>
                  <h:selectOneMenu value="#{rentasBean.newRenta.vehiculoPlaca}" id="vehiculo"
                                   styleClass="form-control" required="true">
                     <f:selectItems value="#{rentasBean.vehiculos}" var="v"
                                    itemLabel="#{v.placa} - #{v.marca} #{v.modelo}"
                                    itemValue="#{v.placa}"/>
                  </h:selectOneMenu>
               </h:panelGrid>

               <!-- Sucursal por código -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="sucursal" value="Sucursal:"/>
                  <h:selectOneMenu value="#{rentasBean.newRenta.sucursalCodigo}" id="sucursal"
                                   styleClass="form-control" required="true">
                     <f:selectItems value="#{rentasBean.sucursales}" var="s"
                                    itemLabel="#{s.nombre}"
                                    itemValue="#{s.codigo}"/>
                  </h:selectOneMenu>
               </h:panelGrid>

               <!-- Fechas -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="inicio" value="Fecha inicio (yyyy-MM-dd):"/>
                  <h:inputText styleClass="form-control" id="inicio"
                               value="#{rentasBean.newRenta.fechaInicio}"
                               required="true">
                     <f:convertDateTime pattern="yyyy-MM-dd"/>
                  </h:inputText>

                  <h:outputLabel for="fin" value="Fecha fin (yyyy-MM-dd):"/>
                  <h:inputText styleClass="form-control" id="fin"
                               value="#{rentasBean.newRenta.fechaFin}"
                               required="true">
                     <f:convertDateTime pattern="yyyy-MM-dd"/>
                  </h:inputText>
               </h:panelGrid>

               <!-- Precio -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="precio" value="Precio total:"/>
                  <h:inputText styleClass="form-control" id="precio"
                               value="#{rentasBean.newRenta.precioTotal}"
                               required="true">
                     <f:validateLongRange minimum="0"/>
                  </h:inputText>
               </h:panelGrid>

               <!-- Estado -->
               <h:panelGrid columns="2">
                  <h:outputLabel for="estado" value="Estado:"/>
                  <h:selectOneMenu styleClass="form-control" id="estado"
                                   value="#{rentasBean.newRenta.estado}"
                                   required="true">
                     <f:selectItem itemLabel="Activa" itemValue="activa"/>
                     <f:selectItem itemLabel="Finalizada" itemValue="finalizada"/>
                     <f:selectItem itemLabel="Cancelada" itemValue="cancelada"/>
                  </h:selectOneMenu>
               </h:panelGrid>

               <h:commandButton styleClass="btn btn-primary" value="Guardar" action="#{rentasBean.add}"/>
               <h:commandButton styleClass="btn btn-warning" type="reset" value="Limpiar"/>

            </h:form>
         </div>

         <!-- Footer -->
         <div>
            <hr/>
            <p>Avis Costa Rica. Todos los derechos reservados &copy; 2025</p>
         </div>
      </div>
   </h:body>
</f:view>
</html>
