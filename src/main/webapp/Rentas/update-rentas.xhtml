<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <title>Avis App - Principal</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <h:outputStylesheet library="css" name="style.css"/>
        <link rel="stylesheet" type="text/css"
              href="#{request.contextPath}/resources/css/style.css"/>
    </h:head>
    <h:body>
        <div class="container">
            <div> <!--Header app-->
                <div style="width: 100%;display: flex;align-items: flex-start"> <!--Encabezado-->
                    <div style="flex: 0 0 60%;">
                        <h:graphicImage library="images" name="download.svg" style="width: 100px;display: block"
                        />
                    </div>
                    <div style="flex: 0 0 40%;">
                        <h1 style="margin-right: 10px">Sistema de gestión Rentario</h1>
                    </div>
                </div>
                <div style="flex: 0 0 100%"><!--Menu-->
                    <h:form>
                        <nav>
                            <ul class="menu">
                                <li class="menu-item">
                                    <h:commandButton value="Home" action="irAHome" styleClass="home-btn" />
                                </li>

                                <li class="menu-item has-sub">
                                    <span class="menu-link">Usuario</span>
                                    <ul class="sub-menu">
                                        <li><h:link value="Listar"     outcome="/Usuario/list-usuario.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Agregar"    outcome="/Usuario/add-Usuario.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Actualizar" outcome="/Usuario/update-usuario-byUsername.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Eliminar"   outcome="/Usuario/delete-usuario-byUsername.xhtml?faces-redirect=true"/></li>
                                    </ul>
                                </li>

                                <li class="menu-item has-sub">
                                    <span class="menu-link">Sucursales</span>
                                    <ul class="sub-menu">
                                        <li><h:link value="Listar"      outcome="/Sucursales/list-sucursal.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Agregar"     outcome="/Sucursales/add-sucursal.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Actualizar"  outcome="/Sucursales/update-sucursal.xhtml?faces-redirect=true"/></li>
                                    </ul>
                                </li>

                                <li class="menu-item has-sub">
                                    <span class="menu-link">Vehículos</span>
                                    <ul class="sub-menu">
                                        <li><h:link value="Listar"      outcome="/Vehiculos/list-vehiculo.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Agregar"     outcome="/Vehiculos/add-vehiculo.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Actualizar"  outcome="/Vehiculos/update-vehiculo.xhtml?faces-redirect=true"/></li>
                                    </ul>
                                </li>

                                <li class="menu-item has-sub">
                                    <span class="menu-link">Rentas</span>
                                    <ul class="sub-menu">
                                        <li><h:link value="Listar"      outcome="/Rentas/list-rentas.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Agregar"     outcome="/Rentas/add-rentas.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Actualizar"  outcome="/Rentas/update-rentas.xhtml?faces-redirect=true"/></li>
                                    </ul>
                                </li>

                                <li class="menu-item has-sub">
                                    <span class="menu-link">Categorías</span>
                                    <ul class="sub-menu">
                                        <li><h:link value="Listar"      outcome="/Categorias/list-categorias.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Agregar"     outcome="/Categorias/add-categorias.xhtml?faces-redirect=true"/></li>
                                        <li><h:link value="Actualizar"  outcome="/Categorias/update-categorias.xhtml?faces-redirect=true"/></li>
                                    </ul>
                                </li>

                                <li class="menu-item has-sub">
                                    <span class="menu-link">Reportes</span>
                                    <ul class="sub-menu">
                                        <li><h:link value="Vehículos por categoría" outcome="/Reportes/list-ByCategoria.xhtml?faces-redirect=true"/></li>
                                        <!-- agrega más reportes aquí -->

                                        <li><h:link value="Vehículos por estado" outcome="/Reportes/list-EstadoCategoria.xhtml?faces-redirect=true"/></li>
                                        <!-- agrega más reportes aquí -->
                                        <li><h:link value="Vehículos por estado" outcome="/Reportes/list-EstadoRenta.xhtml?faces-redirect=true"/></li>
                                        <!-- agrega más reportes aquí -->

                                    </ul>
                                </li>

                            </ul>
                        </nav>
                    </h:form>
                </div><!--Menu end-->
            </div><!--Header app end-->
            <!--Content app-->
            <div style="min-height: 60vh">
                <h3>Actualizar Renta</h3>
                <h:messages id="msg" globalOnly="true"/>

                <!-- Paso 1: Buscar por número de renta -->
                <h:form>
                    <h:panelGrid columns="2" columnClasses="label,value" cellpadding="5">
                        <h:outputLabel value="Número de renta:" for="numBuscar"/>
                        <h:inputText id="numBuscar" styleClass="form-control"
                                     value="#{rentasBean.selectedRenta.numeroRenta}"/>

                        <h:commandButton value="Buscar"
                                         action="#{rentasBean.loadRentaByNumero}"
                                         styleClass="btn btn-info"/>
                        <h:link value="Cancelar"
                                outcome="/Rentas/list-rentas.xhtml?faces-redirect=true"
                                styleClass="btn btn-warning"/>
                    </h:panelGrid>
                </h:form>

                <!-- Paso 2: Formulario de edición -->
                <h:panelGroup rendered="#{not empty rentasBean.selectedRenta.numeroRenta}">
                    <h:form styleClass="container" prependId="false">
                        <h:panelGrid columns="2" columnClasses="label,value" cellpadding="5">

                            <h:outputLabel value="Número de renta:"/>
                            <h:inputText value="#{rentasBean.selectedRenta.numeroRenta}"
                                         styleClass="form-control" readonly="true"/>

                            <h:outputLabel value="Cliente:"/>
                            <h:inputText value="#{rentasBean.selectedRenta.clienteNombre}"
                                         styleClass="form-control" required="true"/>

                            <h:outputLabel value="Vehículo:"/>
                            <h:selectOneMenu value="#{rentasBean.newRenta.vehiculoPlaca}" styleClass="form-control" required="true">
                                <f:selectItem itemLabel="-- seleccione --" itemValue=""/>
                                <f:selectItems value="#{rentasBean.vehiculos}" var="v"
                                               itemValue="#{v.placa}"
                                               itemLabel="#{v.placa} - #{v.marca} #{v.modelo}"/>
                            </h:selectOneMenu>

                            <h:outputLabel value="Sucursal:"/>
                            <h:selectOneMenu value="#{rentasBean.newRenta.sucursalCodigo}" styleClass="form-control" required="true">
                                <f:selectItem itemLabel="-- seleccione --" itemValue="#{null}"/>
                                <f:selectItems value="#{rentasBean.sucursales}" var="s"
                                               itemValue="#{s.codigo}"
                                               itemLabel="#{s.nombre} - #{s.nombre}"/>
                            </h:selectOneMenu>

                            <h:outputLabel value="Fecha inicio:"/>
                            <h:inputText value="#{rentasBean.selectedRenta.fechaInicio}"
                                         styleClass="form-control" required="true">
                                <f:convertDateTime type="date" pattern="yyyy-MM-dd"/>
                            </h:inputText>

                            <h:outputLabel value="Fecha fin:"/>
                            <h:inputText value="#{rentasBean.selectedRenta.fechaFin}"
                                         styleClass="form-control" required="true">
                                <f:convertDateTime type="date" pattern="yyyy-MM-dd"/>
                            </h:inputText>

                            <h:outputLabel value="Precio total:"/>
                            <h:inputText value="#{rentasBean.selectedRenta.precioTotal}"
                                         styleClass="form-control" required="true"/>

                            <h:outputLabel value="Estado:"/>
                            <h:selectOneMenu value="#{rentasBean.selectedRenta.estado}"
                                             styleClass="form-control" required="true">
                                <f:selectItem itemLabel="Activa" itemValue="activa"/>
                                <f:selectItem itemLabel="Finalizada" itemValue="finalizada"/>
                                <f:selectItem itemLabel="Cancelada" itemValue="cancelada"/>
                            </h:selectOneMenu>

                        </h:panelGrid>

                        <h:commandButton value="Guardar"
                                         action="#{rentasBean.update()}"
                                         styleClass="btn btn-primary"/>
                        <h:link value="Cancelar"
                                outcome="/Rentas/list-rentas.xhtml?faces-redirect=true"
                                styleClass="btn btn-warning"/>
                    </h:form>
                </h:panelGroup>

            </div>

            <!--Content app end-->
            <div> <!--Footer app-->
                <hr/>
                <p>Avis Costa Rica. Todos los derechos reservado&copy; 2025</p>
            </div><!--Footer app end-->
        </div>
    </h:body>
</f:view>
</html>
