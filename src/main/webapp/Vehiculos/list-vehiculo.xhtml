<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <title>Avis App - Agregar Vehículo</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <h:outputStylesheet library="css" name="style.css"/>
    </h:head>
    <h:body>
        <div class="container">
            <div> <!--Header app-->
                <div style="width: 100%;display: flex;align-items: flex-start"> <!--Encabezado-->
                    <div style="flex: 0 0 60%;">
                        <h:graphicImage library="images" name="download.svg" style="width: 100px;display: block"/>
                    </div>
                    <div style="flex: 0 0 40%;">
                        <h1 style="margin-right: 10px">Sistema de gestion Rentario</h1>
                    </div>
                </div>
                <div style="flex: 0 0 100%"><!--Menu-->
                    <nav>
                        <ul class="menu-bar">
                            <li class="menu-item">
                                <h:commandButton  styleClass="btn btn-primary"  value="Home" action="irAHome" />
                            </li>
                            <li class="menu-item">
                                <span>Usuario</span>
                                <ul class="sub-menu">
                                    <li class="sub-menu-item">
                                        <h:link value="Listar" outcome="/Usuario/list-usuario.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Agregar" outcome="/Usuario/add-Usuario.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Actualizar" outcome="/Usuario/update-usuario.xhtml?faces-redirect=true"/>
                                    </li>
                                </ul>
                            </li>
                            <li class="menu-item">
                                <span>Sucursales</span>
                                <ul class="sub-menu">
                                    <li class="sub-menu-item">
                                        <h:link value="Listar" outcome="/Sucursales/list-sucursal.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Agregar" outcome="/Sucursales/add-sucursal.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Actualizar" outcome="/Sucursales/update-sucursal.xhtml?faces-redirect=true"/>
                                    </li>
                                </ul>
                            </li>
                            <li class="menu-item">
                                <span>Vehiculos</span>
                                <ul class="sub-menu">
                                    <li class="sub-menu-item">
                                        <h:link value="Listar" outcome="/Vehiculos/list-vehiculo.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Agregar" outcome="/Vehiculos/add-vehiculo.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Actualizar" outcome="/Vehiculos/update-vehiculo.xhtml?faces-redirect=true"/>
                                    </li>
                                </ul>
                            </li>
                            <li class="menu-item">
                                <span>Rentas</span>
                                <ul class="sub-menu">
                                    <li class="sub-menu-item">
                                        <h:link value="Listar" outcome="/Rentas/list-renta.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Agregar" outcome="/Rentas/add-renta.xhtml?faces-redirect=true"/>
                                    </li>
                                </ul>
                            </li>
                            <li class="menu-item">
                                <span>Categorias</span>
                                <ul class="sub-menu">
                                    <li class="sub-menu-item">
                                        <h:link value="listar" outcome="/Categorias/list-categorias.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Agregar" outcome="/Categorias/add-categorias.xhtml?faces-redirect=true"/>
                                    </li>
                                    <li class="sub-menu-item">
                                        <h:link value="Actualizar" outcome="/Categorias/update-categorias.xhtml?faces-redirect=true"/>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </nav>
                </div><!--Menu end-->
            </div><!--Header app end-->
            <div style="min-height: 60vh"> <!--Content app-->
                <h3>Lista de Sucursales</h3>
                <h:dataTable value="#{vehiculoBean.vehiculos}" var="vehiculos" styleClass="table">
                    <h:column headerClass="table-header">
                        <f:facet name="header">Placa</f:facet>
                        <h:outputText value="#{vehiculos.placa}" styleClass="table-data"/>
                    </h:column>
                    <h:column headerClass="table-header">
                        <f:facet name="header">Modelo</f:facet>
                        <h:outputText value="#{vehiculos.modelo}" styleClass="table-data"/>
                    </h:column>
                    <h:column headerClass="table-header">
                        <f:facet name="header">Marca</f:facet>
                        <h:outputText value="#{vehiculos.marca}" styleClass="table-data"/>
                    </h:column>
                    <h:column headerClass="table-header">
                        <f:facet name="header">Categoria</f:facet>
                        <h:outputText value="#{vehiculos.categoria.descripcion}" styleClass="table-data"/>
                    </h:column>
                    <h:column headerClass="table-header">
                        <f:facet name="header">Estado</f:facet>
                        <h:outputText value="#{vehiculos.estado}" styleClass="table-data"/>
                    </h:column>
                    <h:column headerClass="table-header">
                        <f:facet name="header">Año</f:facet>
                        <h:outputText value="#{vehiculos.anio}" styleClass="table-data"/>
                    </h:column>
                    <h:column headerClass="table-header">
                        <f:facet name="header">Precio</f:facet>
                        <h:outputText value="₡#{vehiculos.precio}" styleClass="table-data"/>
                    </h:column>
                    <h:column headerClass="table-header">
                        <f:facet name="header">Imagen</f:facet>
                        <h:graphicImage value="#{request.contextPath}/resources/images/#{vehiculos.imageName}"
                                        width="100" height="70"
                                        rendered="#{not empty vehiculos.imageName}"/>

                    </h:column>
                    <h:column headerClass="table-header">
                        <f:facet name="header">Acciones</f:facet>

                        <!-- Editar -->
                        <h:link value="Editar" styleClass="btn btn-warning"
                                outcome="/Vehiculos/update-vehiculo.xhtml">
                            <f:param name="placa" value="#{vehiculos.placa}"/>
                        </h:link>

                        <!-- Eliminar -->
                        <h:form style="display:inline">
                            <h:commandButton value="Eliminar"
                                             styleClass="btn btn-danger"
                                             action="#{vehiculoBean.delete}"
                                             onclick="return confirm('¿Está seguro de eliminar este vehículo?');">
                                    <f:setPropertyActionListener value="#{vehiculos.placa}" target="#{vehiculoBean.selectedPlaca}"/>
                            </h:commandButton>
                        </h:form>
                    </h:column>


                </h:dataTable>

            </div><!--Content app end-->
            <div> <!--Footer app-->
                <hr/>
                <p>Avis Costa Rica. Todos los derechos reservados &copy; 2025</p>
            </div><!--Footer app end-->
        </div>
    </h:body>
</f:view>
</html>
